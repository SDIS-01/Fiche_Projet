<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche projet</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --rouge:#B51F2E; --rouge-pale:#F7E3E5;
  --encre:#1E2733; --gris:#5B6674; --trait:#D6DBE1; --fond:#EEF1F4; --blanc:#FFFFFF;
  --vert:#5E8C2F; --vert-pale:#E6F0DC; --ambre:#B7860B; --ambre-pale:#FBF1D4;
  --bleu:#2F5F8A; --bleu-pale:#E1EBF4;
  --f:Tahoma, Verdana, "DejaVu Sans", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 var(--f);color:var(--encre);background:var(--fond)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bleu);outline-offset:1px}

#app{display:grid;grid-template-columns:268px 1fr;height:100vh}
aside{background:var(--blanc);border-right:1px solid var(--trait);display:flex;flex-direction:column;min-height:0}
.side-head{padding:14px;border-bottom:1px solid var(--trait)}
.side-head h1{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.side-head h1::before{content:"";width:4px;height:18px;background:var(--rouge);border-radius:2px}
.side-head .btn{width:100%}
.search{width:100%;margin-top:10px;padding:7px 9px;border:1px solid var(--trait);border-radius:5px;background:var(--fond)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{border:1px solid var(--trait);background:var(--blanc);border-radius:12px;padding:2px 9px;font-size:11.5px;cursor:pointer;color:var(--gris)}
.chip.on{background:var(--encre);border-color:var(--encre);color:#fff}
.list{overflow:auto;flex:1;padding:6px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}
.item:hover{background:var(--fond)}
.item.sel{background:var(--rouge-pale);border-left-color:var(--rouge)}
.item b{display:block;font-size:13px;line-height:1.3}
.item small{color:var(--gris);display:flex;justify-content:space-between;gap:6px;margin-top:3px}
.vide{color:var(--gris);font-style:italic;margin:6px 0}

.pill{display:inline-block;border-radius:10px;padding:0 8px;font-size:11px;font-weight:bold;white-space:nowrap}
.st-brouillon{background:#E7EAEE;color:#4A5563}
.st-soumise{background:var(--bleu-pale);color:var(--bleu)}
.st-validee{background:var(--vert-pale);color:var(--vert)}
.st-refusee{background:var(--rouge-pale);color:var(--rouge)}
.st-cree{background:var(--encre);color:#fff}

main{overflow:auto;min-width:0}
.bar{position:sticky;top:0;z-index:5;background:var(--blanc);border-bottom:1px solid var(--trait);padding:12px 20px 0}
.bar-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:18px;line-height:1.25}
.bar .sub{color:var(--gris);font-size:12px}
.dirty{color:var(--ambre)}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--trait);background:var(--blanc);border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:bold}
.btn:hover:not(:disabled){border-color:var(--gris)}
.btn.primary{background:var(--rouge);border-color:var(--rouge);color:#fff}
.btn.primary:hover:not(:disabled){background:#961826}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Parcours de la fiche */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--fond)}
.flow .lbl{color:var(--gris);font-size:12px}
.flow .pill{font-size:12px;padding:2px 10px}
.flow .sep{flex:1}
.btn.ok{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.ko{color:var(--rouge);border-color:#E3B5BA}
.histo{width:100%;border-collapse:collapse;font-size:12px}
.histo th{text-align:left;color:var(--gris);font-weight:normal;padding:4px 8px;border-bottom:1px solid var(--trait)}
.histo td{padding:6px 8px;border-bottom:1px solid var(--fond);vertical-align:top}
.histo .fl{white-space:nowrap}
.hint{margin:0;padding:8px 0 10px;color:var(--gris);font-size:12px}
.hint.lock{color:var(--encre)}

.form{padding:18px 20px 60px;max-width:1080px}
.sec{background:var(--blanc);border:1px solid var(--trait);border-radius:6px;margin-bottom:14px}
.sec>h3{margin:0;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--trait);display:flex;justify-content:space-between;align-items:center}
.sec>h3 .n{color:var(--gris);font-weight:normal;font-size:12px}
.sec-body{padding:12px 14px}
.grid{display:grid;gap:10px 12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11.5px;color:var(--gris)}
.fld input,.fld select,.fld textarea{width:100%;padding:6px 8px;border:1px solid var(--trait);border-radius:4px;background:var(--blanc)}
.fld textarea{resize:vertical;line-height:1.4}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{background:var(--fond);color:var(--encre)}
.aide{font-size:11px;color:var(--gris);line-height:1.35}
.chk-it input{width:auto!important;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.tile,.al-card{text-align:left;border:1px solid var(--trait);background:var(--blanc);border-radius:5px;padding:8px 10px 8px 30px;cursor:pointer;position:relative;line-height:1.35}
.tile::before,.al-card::before{content:"";position:absolute;left:10px;top:11px;width:12px;height:12px;border:1.5px solid #9AA3AE;border-radius:50%}
.tile:hover:not(:disabled),.al-card:hover:not(:disabled){border-color:#9AA3AE}
.tile.on,.al-card.on{border-color:var(--rouge);background:var(--rouge-pale)}
.tile.on::before,.al-card.on::before{background:var(--rouge);border-color:var(--rouge);box-shadow:inset 0 0 0 2px #fff}
.tile:disabled,.al-card:disabled{cursor:default}
.tile b{display:block;font-size:13px}
.tile small{display:block;color:var(--gris);font-size:11.5px}
.al-card{font-size:12.5px}
.al-tabs{display:flex;gap:4px;border-bottom:1px solid var(--trait);flex-wrap:wrap}
.al-tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--gris);font-weight:bold;border-bottom:3px solid transparent;margin-bottom:-1px}
.al-tabs button.on{color:var(--encre);border-bottom-color:var(--rouge)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--fond);font-size:11px;margin-left:6px;text-align:center;color:var(--gris)}
.cnt.plein{background:var(--rouge);color:#fff}
.al-tools{display:flex;gap:10px;align-items:center;margin:10px 0}
.al-tools input{flex:1;padding:6px 9px;border:1px solid var(--trait);border-radius:4px;background:var(--fond)}
.al-sum{font-size:12px;color:var(--gris);white-space:nowrap}
.al-sel{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.al-chip{display:inline-flex;gap:6px;align-items:center;background:var(--rouge-pale);color:var(--rouge);border-radius:14px;padding:3px 4px 3px 10px;font-size:12px;max-width:100%}
.al-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.al-chip button{border:0;background:rgba(181,31,46,.14);color:var(--rouge);border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;padding:0}
details.al-g{border:1px solid var(--trait);border-radius:5px;margin-bottom:6px;background:var(--blanc)}
details.al-g.has{border-left:4px solid var(--rouge)}
details.al-g>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:bold}
details.al-g>summary::-webkit-details-marker{display:none}
details.al-g>summary .t::before{content:"▸";color:var(--gris);display:inline-block;width:14px}
details.al-g[open]>summary .t::before{content:"▾"}
.al-badge{font-size:11px;color:var(--gris);white-space:nowrap}
.has .al-badge{color:var(--rouge)}
.al-body{padding:0 12px 12px}
.al-sous{font-size:12px;color:var(--gris);font-weight:bold;margin:8px 0 5px}
.al-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.fld input.libre{border-style:dashed;border-color:var(--ambre);background:var(--ambre-pale)}
.rep-info{font-size:12px;color:var(--gris);align-self:end;padding-bottom:7px}
.rep-info.ko{color:var(--ambre);font-weight:bold}
.ro{padding:6px 8px;border:1px dashed var(--trait);border-radius:4px;min-height:31px;color:var(--gris)}
.titre input{font-size:16px;font-weight:bold}

.chk{border:1px solid var(--trait);border-radius:4px}
.chk-q{width:100%;border:0;border-bottom:1px solid var(--trait);padding:6px 8px;background:var(--fond)}
.chk-list{max-height:170px;overflow:auto;padding:4px 0}
.chk-it{display:flex;gap:7px;padding:3px 8px;align-items:flex-start;cursor:pointer}
.chk-it:hover{background:var(--fond)}
.chk-it input{margin-top:3px}
.chk-n{font-size:11px;color:var(--gris);padding:3px 8px;border-top:1px solid var(--trait)}
.inline-chk{display:flex;flex-wrap:wrap;gap:4px 14px}

.act{border:1px solid var(--trait);border-left:4px solid var(--rouge);border-radius:4px;padding:10px 12px;margin-bottom:10px}
.act-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.act-head b{font-size:13px}
.taches{margin-top:10px;padding:8px 10px;background:var(--fond);border-radius:4px}
.taches .sub-t{font-size:12px;font-weight:bold;margin-bottom:6px}
.row-t{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px 8px;align-items:end;margin-bottom:6px}
.row-i{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:6px 8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--fond)}
.row-j{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:6px 8px;align-items:end;padding:8px 0;border-bottom:1px solid var(--fond)}
.row-i .fld.com,.row-j .fld.com{grid-column:1/-2}
.lnk{border:0;background:none;color:var(--bleu);cursor:pointer;padding:4px 0;font-weight:bold;font-size:12px}
.lnk.danger{color:var(--rouge)}
.x{border:1px solid var(--trait);background:var(--blanc);border-radius:4px;width:30px;height:31px;cursor:pointer;color:var(--rouge);font-size:15px;line-height:1}

.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:60px 40px;max-width:520px}
.empty h2{margin:0;font-size:18px}
.empty p{margin:0;color:var(--gris)}
.err-box{margin:30px;padding:16px;background:var(--rouge-pale);border-left:4px solid var(--rouge);border-radius:4px}

#toast{position:fixed;bottom:18px;right:18px;z-index:50;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--encre);color:#fff;padding:9px 14px;border-radius:5px;max-width:420px;box-shadow:0 3px 10px rgba(30,39,51,.25)}
.toast.err{background:var(--rouge)}
#modal{position:fixed;inset:0;background:rgba(30,39,51,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#modal.open{display:flex}
.mbox{background:var(--blanc);border-radius:6px;max-width:520px;width:100%;padding:18px 20px;border-top:4px solid var(--rouge)}
.mbox h3{margin:0 0 10px;font-size:16px}
.mbox .mbody{color:var(--encre);margin-bottom:16px}
.mbox ul{margin:6px 0;padding-left:18px}
.mbox .btns{justify-content:flex-end}

@media (max-width:860px){
  #app{grid-template-columns:1fr;height:auto}
  aside{max-height:45vh}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-t,.row-i,.row-j{grid-template-columns:1fr 1fr}
  .row-i .fld.com,.row-j .fld.com{grid-column:1/-1}
}
/* ---------- Mobile ---------- */
.back{display:none}
@media (max-width:700px){
  #app{display:block;height:auto;min-height:100vh}
  body.m-list main{display:none}
  body.m-fiche aside{display:none}
  aside{max-height:none;min-height:100vh;border-right:0}
  .list{overflow:visible;padding:4px 8px 20px}
  .item{padding:12px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .chip{white-space:nowrap;padding:5px 11px}
  .bar{position:static;padding:10px 12px 0}
  .bar-top{flex-direction:column;gap:6px}
  .bar h2{font-size:16px}
  .back{display:inline-block;border:0;background:none;color:var(--bleu);font-weight:bold;padding:4px 0 8px;cursor:pointer}
  .bar .btns{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--blanc);border-top:1px solid var(--trait);padding:8px 10px calc(8px + env(safe-area-inset-bottom));flex-wrap:nowrap;box-shadow:0 -2px 8px rgba(30,39,51,.08)}
  .bar .btns .btn{flex:1;padding:10px 4px;font-size:13px}
  .lg{display:none}
  .flow .sep{display:none}
  .flow .btn{flex:1 1 45%;padding:10px 8px}
  .form{padding:12px 10px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .span2,.span3,.full{grid-column:1/-1}
  .sec>h3,.sec-body{padding-left:12px;padding-right:12px}
  .act{padding:10px}
  .taches{padding:8px}
  .row-t,.row-i,.row-j{grid-template-columns:1fr 1fr;padding:10px 0}
  .row-t>.fld:first-child{grid-column:1/-1}
  .row-t .x,.row-i .x,.row-j .x{justify-self:end}
  .row-i .fld.com,.row-j .fld.com{grid-column:1/-1}
  .fld input,.fld select,.fld textarea,.search,.al-tools input{font-size:16px;padding:8px}
  .x{width:40px;height:40px}
  .lnk{padding:8px 0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .al-cards{grid-template-columns:1fr}
  .al-card{padding-top:10px;padding-bottom:10px}
  .al-tabs{flex-wrap:nowrap;overflow-x:auto}
  .al-tabs button{white-space:nowrap;padding:8px 10px}
  .al-tools{flex-direction:column;align-items:stretch;gap:4px}
  .al-chip span{max-width:230px}
  .histo-wrap{overflow-x:auto}
  .histo{min-width:520px}
  #toast{left:10px;right:10px;bottom:76px}
  .toast{max-width:none}
  #modal{align-items:flex-end;padding:0}
  .mbox{border-radius:10px 10px 0 0;max-height:90vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .mbox .btns .btn{flex:1;padding:11px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Impression ---------- */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:13mm 13mm 16mm}
  html,body{background:#fff;height:auto}
  #app,#toast,#modal{display:none!important}
  #print{display:block;font:10pt/1.4 var(--f);color:#000;padding:0 .6mm}
}
.p-wm{position:fixed;top:42%;left:0;right:0;text-align:center;font-size:92pt;font-weight:bold;color:rgba(181,31,46,.09);transform:rotate(-30deg);z-index:0;pointer-events:none}
.p-foot{position:fixed;bottom:-9mm;left:0;right:0;font-size:8pt;color:#5B6674;display:flex;justify-content:space-between;border-top:.5pt solid #D6DBE1;padding-top:2mm}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5pt solid var(--rouge);padding-bottom:3mm;margin-bottom:5mm}
.p-org{font-size:9pt;color:#5B6674}
.p-org b{display:block;font-size:12pt;color:var(--rouge)}
.p-doc{text-align:right;font-size:9pt;color:#5B6674}
.p-doc b{display:block;font-size:13pt;color:#000}
.p-title{font-size:17pt;font-weight:bold;margin:0 0 2mm;line-height:1.2}
.p-tags{display:flex;gap:2mm;margin-bottom:5mm;flex-wrap:wrap}
.p-tag{border:.8pt solid #999;border-radius:2mm;padding:.4mm 2.5mm;font-size:8.5pt;font-weight:bold}
.p-meta{display:grid;grid-template-columns:repeat(3,1fr);border:.6pt solid #C9CFD6;margin-bottom:5mm}
.p-meta div{padding:1.8mm 2.5mm;border-right:.6pt solid #C9CFD6;border-bottom:.6pt solid #C9CFD6}
.p-meta div:nth-child(3n){border-right:0}
.p-2col{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.p-grp{margin:1.5mm 0 0;font-size:9pt}
.p-al-ref{font-weight:bold;margin:0 0 1mm}
.p-al-obj{font-size:9pt;font-weight:bold;color:var(--rouge);margin:1.5mm 0 .5mm}
.p-al ul{margin:0;padding-left:5mm;font-size:9pt}
.p-meta span{display:block;font-size:7.5pt;color:#5B6674}
.p-meta b{font-size:9.5pt}
.p-sec{margin-bottom:4.5mm;break-inside:avoid-page}
.p-sec h3{font-size:11pt;margin:0 0 1.5mm;padding-left:2.5mm;border-left:1.2mm solid var(--rouge)}
.p-txt{margin:0;white-space:pre-wrap}
.p-tab{width:100%;border-collapse:collapse;font-size:9pt}
.p-tab th{background:#EEF1F4;text-align:left;padding:1.5mm 2mm;border-bottom:.8pt solid #8C96A3;font-size:8.5pt}
.p-tab td{padding:1.5mm 2mm;border-bottom:.5pt solid #D6DBE1;vertical-align:top}
.p-tab tr{break-inside:avoid}
.p-tab tr.t td{color:#3E4854;font-size:8.5pt;padding-top:.8mm;padding-bottom:.8mm}
.p-tab tr.t td:first-child{padding-left:7mm}
.p-tab tr.a td{font-weight:bold;background:#FAFBFC}
.p-ul{margin:0;padding-left:5mm}
.p-dec{border:.8pt solid #8C96A3;padding:3mm;break-inside:avoid}
.p-histo{width:100%;border-collapse:collapse;font-size:8pt;margin-top:3mm}
.p-histo th{text-align:left;color:#5B6674;font-weight:normal;border-bottom:.5pt solid #C9CFD6;padding:.8mm 1.5mm}
.p-histo td{padding:.8mm 1.5mm;border-bottom:.4pt solid #E3E7EB;vertical-align:top}
.p-dec-g{display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm;margin-bottom:3mm}
.p-visas{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:3mm}
.p-visa{border:.6pt dashed #8C96A3;height:24mm;padding:1.5mm 2mm;font-size:8pt;color:#5B6674}
.p-content{position:relative;z-index:1}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="side-head">
      <h1>Fiches projet</h1>
      <button class="btn primary" data-act="new">Nouvelle fiche</button>
      <input class="search" id="q" placeholder="Rechercher une fiche" aria-label="Rechercher une fiche">
      <div class="chips" id="chips"></div>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<datalist id="dl-collab"></datalist>
<div id="print"></div>
<div id="toast" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="mbox"><h3 id="m-t"></h3><div class="mbody" id="m-b"></div><div class="btns"><button class="btn" id="m-no">Annuler</button><button class="btn primary" id="m-ok">OK</button></div></div></div>

<script>
/* ===================== Paramètres ===================== */
const T = {
  FICHES:'Fiches_Projet', PEPS:'Liste_PEPS_AV', MEO:'Liste_Action_MEO', TACHE:'Liste_Tache',
  INST:'Instance', JOUR:'Journal_bord', COLLAB:'Collaborateur', GRPT:'Groupement', HISTO:'Historique_Fiche',
  PE:'Recap_PE', SDACR:'Recap_SDACR'
};
const STATUTS = ['Brouillon','Soumise','Validée','Refusée'];

/* ===================== État ===================== */
const S = { fiches:[], cur:null, dirty:false, collab:[], collabById:{}, grpById:{}, align:{ Lien_PE:[], Lien_SDACR:[] }, alTab:'Lien_PE', alQ:'', alOpen:new Set(), grps:[], histo:[], q:'', fs:'', busy:false, ready:false };
const CH = {};    // choix des colonnes : "Table.Colonne" -> [...]
const COLS = {};  // colonnes existantes : "Table" -> Set

/* ===================== Utilitaires ===================== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const slug = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '-');
function rows(t){ const k = Object.keys(t), n = (t.id || []).length, out = []; for (let i = 0; i < n; i++){ const r = {}; k.forEach(c => r[c] = t[c][i]); out.push(r); } return out; }
function iso(v){ if (v == null || v === '') return ''; if (typeof v === 'string') return v.slice(0, 10); return new Date(v * 1000).toISOString().slice(0, 10); }

function fr(s){ if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; }

/* ===================== Chargement ===================== */
async function loadMeta(){
  try {
    const tabs = rows(await grist.docApi.fetchTable('_grist_Tables'));
    const cols = rows(await grist.docApi.fetchTable('_grist_Tables_column'));
    const byId = {}; tabs.forEach(t => byId[t.id] = t.tableId);
    cols.forEach(c => {
      const tb = byId[c.parentId]; if (!tb) return;
      (COLS[tb] = COLS[tb] || new Set()).add(c.colId);
      try { const o = JSON.parse(c.widgetOptions || '{}'); if (Array.isArray(o.choices)) CH[tb + '.' + c.colId] = o.choices; } catch(e){}
    });
  } catch(e){ console.warn('Métadonnées indisponibles', e); }
  if (!CH[T.FICHES + '.Statut_Fiche']) CH[T.FICHES + '.Statut_Fiche'] = STATUTS;
}
async function loadRefs(){
  const [c, g, pe, sd, ape, asd] = await Promise.all([fetchSafe(T.COLLAB), fetchSafe(T.GRPT), fetchSafe(T.PE), fetchSafe(T.SDACR), fetchSafe('Avancement_PE'), fetchSafe('Avancement_SDACR')]);
  S.grpById = {}; g.forEach(r => S.grpById[r.id] = r.Groupement || r.Libelle_Groupement || '');
  S.collab = c.filter(r => r.Nom_Prenom).sort((a, b) => a.Nom_Prenom.localeCompare(b.Nom_Prenom, 'fr'));
  S.collabById = {}; S.collab.forEach(r => S.collabById[r.id] = r);
  const dl = document.getElementById('dl-collab'); if (dl) dl.innerHTML = S.collab.map(c => `<option value="${esc(c.Nom_Prenom)}"></option>`).join('');
  const lab = r => ({ id:r.id, label:[r.ID_Sous_Objectif, r.Resultat_Attendu].filter(Boolean).join(' : ') });
  const cmp = (a, b) => String(a).localeCompare(String(b), 'fr', { numeric:true });
  const build = (recap, av) => {
    const obj = {}; av.forEach(r => obj[r.id] = r.ID_Objectif || '');
    return recap.map(r => ({ id:r.id, obj:obj[r.ID_Objectif] || 'Objectif non renseigné', sous:r.ID_Sous_Objectif || '', res:r.Resultat_Attendu || '' }))
      .filter(x => x.sous || x.res)
      .sort((a, b) => cmp(a.obj, b.obj) || cmp(a.sous, b.sous) || cmp(a.res, b.res));
  };
  S.align.Lien_PE = build(pe, ape);
  S.align.Lien_SDACR = build(sd, asd);
  S.grps = g.filter(r => r.Groupement).map(r => ({ id:r.id, code:r.Groupement, lib:r.Libelle_Groupement || '', label:r.Groupement + (r.Libelle_Groupement ? ' : ' + r.Libelle_Groupement : '') })).sort((a, b) => a.code.localeCompare(b.code, 'fr'));
}

  let o = {}; try { o = JSON.parse(s || '{}') || {}; } catch(e){}

    actions: (o.actions || []).map(a => ({ uid:a.uid || uid(), libelle:'', porteur:0, debut:'', echeance:'', commentaire:'', ...a, taches:(a.taches || []).map(t => ({ uid:t.uid || uid(), libelle:'', porteur:0, debut:'', echeance:'', ...t })) })),
    instances: (o.instances || []).map(x => ({ uid:x.uid || uid(), cible:'projet', ...x })),
    journal: (o.journal || []).map(x => ({ uid:x.uid || uid(), cible:'projet', ...x }))
  };
}
function fromRow(r){

    id:r.id, Titre:t('Titre'), Porteur:r.Porteur || 0, Porteur_Saisi:t('Porteur_Saisi'),
    Contexte:t('Contexte'), Descriptif:t('Descriptif'), Benefices:t('Benefices'), Sans_Projet:t('Sans_Projet'),
    Perimetre:t('Perimetre'), Hors_Perimetre:t('Hors_Perimetre'), Parties_Prenantes:t('Parties_Prenantes'), Groupements_Impactes:L(r.Groupements_Impactes),
    Date_Debut_Souhaitee:iso(r.Date_Debut_Souhaitee), Echeance:iso(r.Echeance),
    Budget_Global:(r.Budget_Global ?? ''), Budget_Investissement:(r.Budget_Investissement ?? r.Budget_Estime ?? ''), Budget_Fonctionnement:n('Budget_Fonctionnement'),

    Projet_Cree:r.Projet_Cree || 0, Lien_PE:L(r.Lien_PE), Lien_SDACR:L(r.Lien_SDACR),

function normBudget(f){

  f._repartir = (f.Budget_Investissement !== '' && f.Budget_Investissement != null) || (f.Budget_Fonctionnement !== '' && f.Budget_Fonctionnement != null);
  return f;
}

function getPath(obj, path){ return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function resolveCollab(el){
  const path = el.dataset.p, name = el.value.trim().replace(/\s+/g, ' ');
  const found = findCollab(name);
  const id = found ? found.id : 0, nom = found ? '' : name;

function renderAlign(){

  const q = S.alQ.trim().toLowerCase();

  const groups = [];

  if (!items.length){ $('#al-groups').innerHTML = '<p class="vide">Aucun objectif disponible dans ce référentiel.</p>'; return; }
  if (!groups.length){ $('#al-groups').innerHTML = '<p class="vide">Aucun objectif ne correspond à la recherche.</p>'; return; }
  $('#al-groups').innerHTML = groups.map(g => {
    const total = items.filter(i => i.obj === g.obj).length;
    const n = items.filter(i => i.obj === g.obj && sel.includes(i.id)).length;
    const key = k + '|' + g.obj;
    const open = q || S.alOpen.has(key);
    let body = '', last = null;
    g.list.forEach(i => {
      if (i.res && i.sous !== last){ body += (last !== null ? '</div>' : '') + `<div class="al-sous">${esc(i.sous)}</div><div class="al-cards">`; last = i.sous; }

  <section class="sec"><h3>Pourquoi ce projet</h3><div class="sec-body grid g2">

function renderAll(){ renderList(); renderMain(); }
function repInfo(f){
  const g = Number(f.Budget_Global) || 0, i = Number(f.Budget_Investissement) || 0, fo = Number(f.Budget_Fonctionnement) || 0, r = g - i - fo;
  if (!g) return { ko:false, txt:'Renseigne le budget global pour vérifier la répartition.' };
  if (r > 0) return { ko:false, txt:'Reste à répartir : ' + money(r) };
  if (r < 0) return { ko:true, txt:'La répartition dépasse le budget global de ' + money(-r) };
  return { ko:false, txt:'Budget entièrement réparti.' };
}
function updateRep(){ const el = $('#rep-info'); if (!el || !S.cur) return; const r = repInfo(S.cur); el.textContent = r.txt; el.classList.toggle('ko', r.ko); }
function markDirty(){ if (!S.dirty){ S.dirty = true; renderBar(); } }

/* ===================== Événements ===================== */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q'){ S.q = el.value; renderList(); return; }
  if (el.id === 'alq'){ S.alQ = el.value; renderAlign(); return; }
  if (el.hasAttribute('data-filter')){
    const q = el.value.toLowerCase();
    el.parentElement.querySelectorAll('.chk-it').forEach(it => it.style.display = it.textContent.toLowerCase().includes(q) ? '' : 'none');
    return;
  }
  if (el.hasAttribute('data-collab')) return;
  if (el.dataset.p && S.cur){
    let v = el.value;
    if (el.dataset.t === 'n') v = v ? Number(v) : 0;
    setPath(S.cur, el.dataset.p, v);
    if (/^Budget_/.test(el.dataset.p)) updateRep();
    markDirty();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.m && S.cur){
    const key = el.dataset.m, v = el.dataset.mt === 'n' ? Number(el.value) : el.value;
    const arr = S.cur[key];
    const i = arr.indexOf(v);
    if (el.checked && i < 0) arr.push(v); else if (!el.checked && i >= 0) arr.splice(i, 1);
    const cnt = document.querySelector(`[data-count="${key}"]`); if (cnt) cnt.textContent = arr.length + ' sélectionné(s)';
    markDirty(); return;
  }
  if (el.hasAttribute('data-collab') && S.cur){ resolveCollab(el); return; }
  if (!el.dataset.p || !S.cur) return;
  // Mises à jour ciblées : pas de re-rendu complet, pour ne pas perdre le clic en cours
  const m = el.dataset.p.match(/^contenu\.actions\.(\d+)\.libelle$/);
  if (m){
    const i = Number(m[1]), a = S.cur.contenu.actions[i];
    document.querySelectorAll('select[data-p$=".cible"] option[value="' + a.uid + '"]').forEach(o => o.textContent = a.libelle || 'Action ' + (i + 1));
  }
  if (el.dataset.p === 'Titre'){ const h = $('#bar h2'); if (h) h.textContent = S.cur.Titre || 'Nouvelle fiche'; }
});
document.addEventListener('click', async e => {
  const chip = e.target.closest('[data-fs]'); if (chip){ S.fs = chip.dataset.fs; renderChips(); renderList(); return; }
  const it = e.target.closest('[data-open]'); if (it){ openFiche(Number(it.dataset.open)); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = Number(b.dataset.i), j = Number(b.dataset.j), c = S.cur && S.cur.contenu;
  switch (a){
    case 'new': if (await confirmLeave()){ S.cur = normBudget(newFiche()); S.dirty = false; S.histo = []; renderAll(); } break;
    case 'save': save(); break;
    case 'print': doPrint(); break;
    case 'alTab': S.alTab = b.dataset.k; renderAlign(); break;
    case 'tog': {
      const key = b.dataset.k, id = Number(b.dataset.id), arr = S.cur[key], p = arr.indexOf(id);
      if (p >= 0) arr.splice(p, 1); else arr.push(id);
      markDirty();
      if (key === 'Groupements_Impactes') $('#tiles').innerHTML = tilesHtml(); else renderAlign();
      break;
    }
    case 'create': createProject(); break;
    case 'move': moveStatut(b.dataset.s); break;
    case 'cancel': cancelEdits(); break;
    case 'back': if (await confirmLeave()){ S.cur = null; S.dirty = false; S.histo = []; renderAll(); window.scrollTo(0, 0); } break;
    case 'repartir':
      if (S.cur._repartir){ S.cur.Budget_Investissement = ''; S.cur.Budget_Fonctionnement = ''; S.cur._repartir = false; }
      else S.cur._repartir = true;
      S.dirty = true; renderMain(); break;
    case 'addAction': c.actions.push({ uid:uid(), libelle:'', porteur:0, debut:'', echeance:'', commentaire:'', taches:[] }); S.dirty = true; renderMain(); break;
    case 'delAction': {
      const gone = c.actions[i].uid; c.actions.splice(i, 1);
      c.instances.concat(c.journal).forEach(x => { if (x.cible === gone) x.cible = 'projet'; });
      S.dirty = true; renderMain(); break;
    }
    case 'addTask': c.actions[i].taches.push({ uid:uid(), libelle:'', porteur:0, debut:'', echeance:'' }); S.dirty = true; renderMain(); break;
    case 'delTask': c.actions[i].taches.splice(j, 1); S.dirty = true; renderMain(); break;
    case 'addInst': c.instances.push({ uid:uid(), date:'', type:'', instance:'', cible:'projet', rapporteur:0, commentaire:'' }); S.dirty = true; renderMain(); break;
    case 'delInst': c.instances.splice(i, 1); S.dirty = true; renderMain(); break;
    case 'addJour': c.journal.push({ uid:uid(), date:today(), nature:'', collaborateur:0, cible:'projet', commentaire:'' }); S.dirty = true; renderMain(); break;
    case 'delJour': c.journal.splice(i, 1); S.dirty = true; renderMain(); break;
  }
});
async function confirmLeave(){
  if (!S.dirty) return true;
  return modal('Modifications non enregistrées', 'Les modifications de la fiche en cours seront perdues.', 'Abandonner les modifications');
}
async function openFiche(id){
  if (S.cur && S.cur.id === id) return;
  if (!(await confirmLeave())) return;
  const r = S.fiches.find(x => x.id === id); if (!r) return;
  S.cur = normBudget(fromRow(r)); S.dirty = false; await loadHisto(); renderAll(); window.scrollTo(0, 0);
  try { grist.setCursorPos({ rowId:id }); } catch(e){}
}

/* ===================== Enregistrement ===================== */
async function save(silent){
  const f = S.cur; if (!f || S.busy) return false;
  if (!f.Titre.trim()){ toast('Renseigne le titre du projet avant d\'enregistrer.', 'err'); return false; }
  S.busy = true;
  try {
    if (f.id) await apply([['UpdateRecord', T.FICHES, f.id, toFields(f)]]);
    else { const [id] = await apply([['AddRecord', T.FICHES, null, toFields(f)]]); f.id = id; await logStatut(id, '', f.Statut_Fiche, 'Création de la fiche'); await loadHisto(); }
    S.dirty = false;
    await reloadList();
    const r = S.fiches.find(x => x.id === f.id); if (r){ f.Cree_Par = r.Cree_Par || ''; f.Cree_Le = iso(r.Cree_Le); }
    renderBar();
    try { grist.setCursorPos({ rowId:f.id }); } catch(e){}
    if (!silent) toast('Fiche enregistrée.');
    return true;
  } catch(e){ toast('Enregistrement impossible : ' + e.message, 'err'); return false; }
  finally { S.busy = false; }
}

async function cancelEdits(){
  if (!S.cur || !S.dirty || S.busy) return;
  const nouvelle = !S.cur.id;
  const ok = await modal('Annuler les modifications',
    nouvelle ? 'Cette fiche n\'a jamais été enregistrée : elle sera abandonnée.' : 'La fiche reviendra à son dernier enregistrement.',
    'Annuler les modifications');
  if (!ok) return;
  if (nouvelle){ S.cur = null; S.dirty = false; S.histo = []; renderAll(); return; }
  try { await reloadList(); } catch(e){}
  const r = S.fiches.find(x => x.id === S.cur.id);
  S.cur = r ? normBudget(fromRow(r)) : null; S.dirty = false;
  await loadHisto(); renderAll();
  toast('Modifications annulées.');
}

/* ===================== Statut et historique ===================== */
async function loadHisto(){
  S.histo = [];
  if (!S.cur || !S.cur.id) return;
  try {
    S.histo = rows(await grist.docApi.fetchTable(T.HISTO)).filter(h => h.Fiche === S.cur.id).sort((a, b) => (b.Date || 0) - (a.Date || 0) || b.id - a.id);
  } catch(e){ console.warn('Historique indisponible', e); }
}
let histoWarned = false;
async function logStatut(ficheId, de, vers, com){
  try { await apply([['AddRecord', T.HISTO, null, { Fiche:ficheId, Ancien_Statut:de || '', Nouveau_Statut:vers, Commentaire:com || '' }]]); }
  catch(e){ if (!histoWarned){ histoWarned = true; toast('Historique non enregistré : vérifie la table ' + T.HISTO + ' (' + e.message + ').', 'err'); } }
}
async function moveStatut(vers){
  const f = S.cur; if (!f || f.Projet_Cree || S.busy) return;
  if (!f.Titre.trim()){ toast('Renseigne le titre du projet avant de changer le statut.', 'err'); return; }
  const de = f.Statut_Fiche;
  const titres = { Soumise:'Soumettre à la direction', Validée:'Valider la fiche', Refusée:'Refuser la fiche', Brouillon:'Remettre en brouillon' };
  const decision = vers === 'Validée' || vers === 'Refusée';
  const ok = await modal(titres[vers],
    `La fiche passera de <b>${esc(de)}</b> à <b>${esc(vers)}</b>.
     <label class="fld" style="margin-top:12px"><span>${decision ? 'Avis de la direction' : 'Commentaire'} (facultatif)</span><textarea id="m-com" rows="3">${decision ? esc(f.Avis_Direction) : ''}</textarea></label>`,
    titres[vers]);
  if (!ok) return;
  const com = ($('#m-com').value || '').trim();
  const prev = { st:f.Statut_Fiche, dd:f.Date_Decision, av:f.Avis_Direction };
  f.Statut_Fiche = vers;
  if (decision){ f.Date_Decision = today(); if (com) f.Avis_Direction = com; }
  if (vers === 'Brouillon') f.Date_Decision = '';
  S.dirty = true;
  if (!(await save(true))){ f.Statut_Fiche = prev.st; f.Date_Decision = prev.dd; f.Avis_Direction = prev.av; renderBar(); return; }
  await logStatut(f.id, de, vers, com);
  await loadHisto(); await reloadList(); renderMain();
  toast({ Soumise:'Fiche soumise à la direction.', Validée:'Fiche validée.', Refusée:'Fiche refusée.', Brouillon:'Fiche remise en brouillon.' }[vers]);
}

/* ===================== Création du projet ===================== */
async function createProject(){
  const f = S.cur; if (!f || f.Projet_Cree) return;
  const titre = f.Titre.trim();
  if (f.Statut_Fiche !== 'Validée'){ toast('La fiche doit être validée avant de créer le projet.', 'err'); return; }
  if (!titre){ toast('Renseigne le titre du projet.', 'err'); return; }

  const c = f.contenu;
  const acts = c.actions.filter(a => (a.libelle || '').trim());
  const nbT = acts.reduce((n, a) => n + a.taches.filter(t => (t.libelle || '').trim()).length, 0);
  const insts = c.instances.filter(x => x.date || x.instance || x.type || (x.commentaire || '').trim());
  const jours = c.journal.filter(x => (x.commentaire || '').trim());

  // Contrôle des identifiants
  const [peps, meo] = await Promise.all([fetchSafe(T.PEPS), fetchSafe(T.MEO)]);
  const idsP = new Set(peps.map(r => String(r.ID_Projet_Action_AV || '').trim()));
  const idsM = new Set(meo.map(r => String(r.ID_Action_MEO || '').trim()));
  const pb = [];
  if (idsP.has(titre) || idsM.has(titre)) pb.push(`Un projet ou une action porte déjà l'identifiant « ${esc(titre)} ». Modifie le titre de la fiche.`);
  acts.forEach(a => {
    const l = a.libelle.trim();
    if (l === titre) pb.push(`L'action « ${esc(l)} » porte le même intitulé que le projet.`);
    else if (idsP.has(l)) pb.push(`L'action « ${esc(l)} » porte l'identifiant d'un projet existant.`);
  });
  if (pb.length){ await modal('Création impossible', `<ul>${pb.map(x => `<li>${x}</li>`).join('')}</ul>`, 'Compris', false); return; }

  // Noms saisis manuellement : nouvelle tentative de rapprochement, sinon notés en commentaire
  const ref = (id, nom) => id || (findCollab(nom) || {}).id || 0;
  const libres = new Set();
  const note = (id, nom) => (!ref(id, nom) && nom) ? (libres.add(nom), nom) : '';
  note(f.Porteur, f.Porteur_Saisi);
  acts.forEach(a => { note(a.porteur, a.porteurNom); a.taches.forEach(t => note(t.porteur, t.porteurNom)); });
  insts.forEach(x => note(x.rapporteur, x.rapporteurNom)); jours.forEach(x => note(x.collaborateur, x.collaborateurNom));
  const avert = libres.size ? `<p style="background:var(--ambre-pale);padding:8px 10px;border-radius:4px;margin:10px 0 0">Absents de la table Collaborateur : <b>${[...libres].map(esc).join(', ')}</b>. Le champ porteur restera vide et le nom sera noté en commentaire.</p>` : '';
  const withNote = (txt, label, id, nom) => { const n = note(id, nom); return n ? ((txt ? txt + '\n' : '') + label + ' : ' + n) : (txt || ''); };
  const ok = await modal('Créer le projet',
    `<div style="margin-bottom:10px">Nature du projet :
       <label style="margin-left:10px"><input type="radio" name="nat" value="PEPS"> PEPS</label>
       <label style="margin-left:14px"><input type="radio" name="nat" value="AV"> AV</label></div>
     Le projet <b>${esc(titre)}</b> sera créé avec :
     <ul><li>${acts.length} action(s)</li><li>${nbT} tâche(s)</li><li>${insts.length} passage(s) en instance</li><li>${jours.length} entrée(s) de journal de bord</li></ul>
     Les lignes sans intitulé ne sont pas reprises. La fiche passera ensuite en lecture seule.${avert}`, 'Créer le projet');
  if (!ok) return;
  const natEl = document.querySelector('input[name="nat"]:checked');
  if (!natEl){ toast('Choisis la nature du projet : PEPS ou AV.', 'err'); return; }
  const nat = natEl.value;
  if (S.dirty && !(await save(true))) return;

  S.busy = true;
  const created = [];
  const add = async (table, fields) => { const [id] = await apply([['AddRecord', table, null, pick(table, fields)]]); created.push([table, id]); return id; };
  const addMany = async (table, list) => {
    if (!list.length) return [];
    const ids = await apply(list.map(x => ['AddRecord', table, null, pick(table, x)]));
    ids.forEach(id => created.push([table, id])); return ids;
  };
  try {
    // 1. Projet
    const pId = await add(T.PEPS, { ID_Projet_Action_AV:titre });
    // 2. Ligne projet (PEPS / AV) dans Liste_Action_MEO
    const lineId = await add(T.MEO, {
      ID_Projet_Action_AV:pId, ID_Action_MEO:titre, Nature:nat, Porteur:ref(f.Porteur, f.Porteur_Saisi), Commentaire:withNote('', 'Porteur pressenti', f.Porteur, f.Porteur_Saisi),
      Date_Debut:sec(f.Date_Debut_Souhaitee), Ech_Prev:sec(f.Echeance),
      Descriptif_Initiative:f.Descriptif || '', ID_Projet_Etablissement_23_28:toList(f.Lien_PE),
      ID_SDACR_25_30:toList(f.Lien_SDACR)
    });
    // 3. Actions MEO
    const actIds = await addMany(T.MEO, acts.map(a => ({
      ID_Projet_Action_AV:pId, ID_Action_MEO:a.libelle.trim(), Nature:'MEO', Porteur:ref(a.porteur, a.porteurNom),
      Date_Debut:sec(a.debut), Ech_Prev:sec(a.echeance), Commentaire:withNote(a.commentaire, 'Porteur pressenti', a.porteur, a.porteurNom)
    })));
    const map = { projet:lineId }; acts.forEach((a, k) => map[a.uid] = actIds[k]);
    // 4. Tâches
    const taches = [];
    acts.forEach(a => a.taches.filter(t => (t.libelle || '').trim()).forEach(t => taches.push({
      ID_Tache:t.libelle.trim(), ID_Action_MEO:map[a.uid], Porteur:ref(t.porteur, t.porteurNom),
      Date_Debut:sec(t.debut), Ech_Prev:sec(t.echeance), Avancement:0, Commentaire:withNote('', 'Porteur pressenti', t.porteur, t.porteurNom)
    })));
    await addMany(T.TACHE, taches);
    // 5. Instances
    await addMany(T.INST, insts.map(x => ({
      Date:sec(x.date), Type:x.type || '', Instance:x.instance || '', Commentaire:withNote(x.commentaire, 'Rapporteur', x.rapporteur, x.rapporteurNom),
      Rapporteur:ref(x.rapporteur, x.rapporteurNom), ID_Action_MEO:map[x.cible] || lineId
    })));
    // 6. Journal de bord
    await addMany(T.JOUR, jours.map(x => ({
      Date:sec(x.date), Nature_Origine:x.nature || '', Commentaire:withNote(x.commentaire, 'Collaborateur', x.collaborateur, x.collaborateurNom),
      Collaborateur:ref(x.collaborateur, x.collaborateurNom), ID_PEPS_AV_MEO:map[x.cible] || lineId
    })));
    // 7. Lien fiche -> projet
    await apply([['UpdateRecord', T.FICHES, f.id, pick(T.FICHES, { Projet_Cree:pId })]]);
    f.Projet_Cree = pId; S.dirty = false;
    await logStatut(f.id, 'Validée', 'Projet créé', `Projet ${titre} créé en nature ${nat}`); await loadHisto();
    await reloadList(); renderMain();
    toast('Projet créé.');
  } catch(e){
    console.error(e);
    let rb = 'Les lignes déjà créées ont été supprimées.';
    try {
      const byTable = []; created.slice().reverse().forEach(([t, id]) => byTable.push(['RemoveRecord', t, id]));
      if (byTable.length) await apply(byTable);
    } catch(e2){ rb = 'La suppression des lignes déjà créées a échoué : vérifie Liste_PEPS_AV et Liste_Action_MEO.'; }
    await modal('Création interrompue', `Erreur : ${esc(e.message)}<br><br>${rb}`, 'Compris', false);
  } finally { S.busy = false; }
}

/* ===================== Impression ===================== */
function prioCls(p){ p = String(p || ''); return p.startsWith('P1') ? 'color:#B51F2E;border-color:#B51F2E' : p.startsWith('P2') ? 'color:#D26A1E;border-color:#D26A1E' : p.startsWith('P3') ? 'color:#9A7400;border-color:#9A7400' : ''; }
function buildPrint(){
  const f = S.cur, c = f.contenu;
  const st = f.Projet_Cree ? 'Projet créé' : f.Statut_Fiche;
  const ratt = v => { if (v === 'projet' || !v) return 'Projet'; const a = c.actions.find(x => x.uid === v); return a ? (a.libelle || 'Action') : 'Projet'; };
  const has = v => v && String(v).trim();
  const txt = (t, v) => has(v) ? `<section class="p-sec"><h3>${t}</h3><p class="p-txt">${esc(v)}</p></section>` : '';
  const duo = (a, b) => (a && b) ? `<div class="p-2col">${a}${b}</div>` : (a || b);
  const nb = v => (v === '' || v == null) ? '' : new Intl.NumberFormat('fr-FR').format(Number(v));
  const rep = [f.Budget_Investissement !== '' && f.Budget_Investissement != null ? 'Invest. ' + money(f.Budget_Investissement) : '', f.Budget_Fonctionnement !== '' && f.Budget_Fonctionnement != null ? 'Fonct. ' + money(f.Budget_Fonctionnement) : ''].filter(Boolean).join(' / ');
  const meta = [
    ['Porteur', pers(f.Porteur, f.Porteur_Saisi)], ['Groupement', grpOf(f.Porteur)], ['Début souhaité', fr(f.Date_Debut_Souhaitee)],
    ['Échéance', fr(f.Echeance)], ['Budget global', money(f.Budget_Global)], ['Répartition', rep]
  ];
  const grps = S.grps.filter(x => f.Groupements_Impactes.includes(x.id)).map(x => x.label);
  const pp = (has(f.Parties_Prenantes) || grps.length) ? `<section class="p-sec"><h3>Parties prenantes</h3>
      ${has(f.Parties_Prenantes) ? `<p class="p-txt">${esc(f.Parties_Prenantes)}</p>` : ''}
      ${grps.length ? `<p class="p-grp"><b>Groupements impactés :</b> ${grps.map(esc).join(', ')}</p>` : ''}</section>` : '';
  const alBlock = (k, titre) => {
    const its = S.align[k].filter(x => f[k].includes(x.id)); if (!its.length) return '';
    const objs = [...new Set(its.map(x => x.obj))];
    return `<div class="p-al"><p class="p-al-ref">${titre}</p>${objs.map(o => `<div class="p-al-obj">${esc(o)}</div><ul>${its.filter(x => x.obj === o).map(x => `<li>${esc(x.res || x.sous)}</li>`).join('')}</ul>`).join('')}</div>`;
  };
  const alPE = alBlock('Lien_PE', 'Projet d\'établissement 2023-2028'), alSD = alBlock('Lien_SDACR', 'SDACR 2025-2030');
  const strat = (alPE || alSD) ? `<section class="p-sec"><h3>Alignement stratégique</h3>${duo(alPE, alSD)}</section>` : '';
  const acts = c.actions.filter(a => has(a.libelle));
  const actTab = acts.length ? `<section class="p-sec"><h3>Plan d'action</h3><table class="p-tab">
      <thead><tr><th style="width:50%">Action</th><th>Porteur</th><th>Début</th><th>Échéance</th></tr></thead><tbody>
      ${acts.map(a => `<tr class="a"><td>${esc(a.libelle)}${a.commentaire ? `<div style="font-weight:normal;font-size:8.5pt;color:#3E4854">${esc(a.commentaire)}</div>` : ''}</td><td>${esc(pers(a.porteur, a.porteurNom))}</td><td>${fr(a.debut)}</td><td>${fr(a.echeance)}</td></tr>
        ${a.taches.filter(t => has(t.libelle)).map(t => `<tr class="t"><td>${esc(t.libelle)}</td><td>${esc(pers(t.porteur, t.porteurNom))}</td><td>${fr(t.debut)}</td><td>${fr(t.echeance)}</td></tr>`).join('')}`).join('')}
      </tbody></table></section>` : '';
  const insts = c.instances.filter(x => x.date || x.instance || x.type);
  const instTab = insts.length ? `<section class="p-sec"><h3>Passages en instance</h3><table class="p-tab">
      <thead><tr><th>Date</th><th>Type</th><th>Instance</th><th>Rattachée à</th><th>Rapporteur</th><th style="width:30%">Commentaire</th></tr></thead><tbody>
      ${insts.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(x => `<tr><td>${fr(x.date)}</td><td>${esc(x.type)}</td><td>${esc(x.instance)}</td><td>${esc(ratt(x.cible))}</td><td>${esc(pers(x.rapporteur, x.rapporteurNom))}</td><td>${esc(x.commentaire)}</td></tr>`).join('')}
      </tbody></table></section>` : '';
  const jours = c.journal.filter(x => has(x.commentaire));
  const jourTab = jours.length ? `<section class="p-sec"><h3>Journal de bord</h3><table class="p-tab">
      <thead><tr><th>Date</th><th>Nature / origine</th><th>Collaborateur</th><th>Rattachée à</th><th style="width:40%">Commentaire</th></tr></thead><tbody>
      ${jours.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).map(x => `<tr><td>${fr(x.date)}</td><td>${esc(x.nature)}</td><td>${esc(pers(x.collaborateur, x.collaborateurNom))}</td><td>${esc(ratt(x.cible))}</td><td>${esc(x.commentaire)}</td></tr>`).join('')}
      </tbody></table></section>` : '';
  return `
    <div class="p-content">
      <div class="p-head">
        <div class="p-org"><b>SDIS de l'Ain</b>Service départemental d'incendie et de secours</div>
        <div class="p-doc"><b>Fiche projet</b>Statut : ${esc(st)}</div>
      </div>
      <h1 class="p-title">${esc(f.Titre || 'Sans titre')}</h1>
      <div class="p-tags">
        <span class="p-tag">${esc(st)}</span>
      </div>
      <div class="p-meta">${meta.map(([k, v]) => `<div><span>${k}</span><b>${esc(v) || '&nbsp;'}</b></div>`).join('')}</div>
      ${txt('Contexte et problème constaté', f.Contexte)}
      ${txt('Objectifs', f.Descriptif)}
      ${duo(txt('Bénéfices attendus', f.Benefices), txt('Si le projet n\'est pas lancé', f.Sans_Projet))}
      ${duo(txt('Inclus dans le périmètre', f.Perimetre), txt('Hors périmètre', f.Hors_Perimetre))}
      ${pp}
      ${actTab}
      ${txt('Ressources humaines', f.Ressources)}
      ${duo(txt('Risques et solutions', f.Risques), txt('Contraintes', f.Contraintes))}
      ${txt('Indicateurs de réussite', f.Indicateurs)}
      ${strat}${instTab}${jourTab}
      <section class="p-sec"><h3>Décision de la direction</h3><div class="p-dec">
        <div class="p-dec-g"><div>Statut : <b>${esc(f.Statut_Fiche)}</b></div><div>Date de décision : <b>${fr(f.Date_Decision) || '..... / ..... / ..........'}</b></div></div>
        <div>Avis :</div><p class="p-txt" style="min-height:14mm">${esc(f.Avis_Direction)}</p>
        <div class="p-visas"><div class="p-visa">Visa du porteur</div><div class="p-visa">Visa de la direction</div></div>
      </div></section>
    </div>`;
}
function doPrint(){
  if (!S.cur) return;
  const css = v => '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ') + '"';
  let st = document.getElementById('page-style');
  if (!st){ st = document.createElement('style'); st.id = 'page-style'; document.head.appendChild(st); }
  st.textContent = `@page{
    @bottom-left{content:${css('Fiche projet : ' + (S.cur.Titre || 'Sans titre') + '   |   Éditée le ' + fr(today()))};font:8pt Tahoma,Verdana,sans-serif;color:#5B6674}
    @bottom-right{content:"Page " counter(page) " / " counter(pages);font:8pt Tahoma,Verdana,sans-serif;color:#5B6674}
  }`;
  $('#print').innerHTML = buildPrint();
  setTimeout(() => window.print(), 60);
}

/* ===================== Démarrage ===================== */
document.getElementById('q').value = '';
renderChips();
grist.ready({ requiredAccess:'full' });
(async () => {
  try {
    await loadMeta();
    await loadRefs();
    await reloadList();
    S.ready = true;
    renderMain();
  } catch(e){
    $('#main').innerHTML = `<div class="err-box"><b>Impossible de charger la table ${T.FICHES}.</b><br>Vérifie qu'elle existe dans le document et que le widget a le niveau d'accès « Accès complet au document ».<br><small>${esc(e.message)}</small></div>`;
  }
})();
grist.onRecords(async () => { if (S.ready && !S.busy) { try { await reloadList(); } catch(e){} } });
grist.onRecord(rec => { if (!S.ready || !rec || !rec.id || S.dirty || S.busy) return; if (S.cur && S.cur.id === rec.id) return; openFiche(rec.id); });
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.classList || !d.classList.contains('al-g') || S.alQ.trim()) return;
  if (d.open) S.alOpen.add(d.dataset.key); else S.alOpen.delete(d.dataset.key);
}, true);
window.addEventListener('beforeunload', e => { if (S.dirty){ e.preventDefault(); e.returnValue = ''; } });
</script>
